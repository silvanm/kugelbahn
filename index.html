<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Kugelbahn</title>
<style>
  :root { --fg:#f4f1ea; --bg:#1b1d22; --accent:#d9a521; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); }
  /* Touch: kein Markieren, kein Lupen-/Kontextmenü, kein Doppeltipp- oder Pinch-Zoom der Seite */
  html, body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
               -webkit-tap-highlight-color:transparent; touch-action:manipulation; overscroll-behavior:none; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; top:16px; left:16px; background:rgba(20,22,26,.72); backdrop-filter: blur(6px);
         padding:14px 16px; border-radius:12px; min-width:220px; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #hud h1 { margin:0 0 6px; font-size:18px; letter-spacing:.3px; }
  #hud .row { font-size:13px; opacity:.85; margin:2px 0; }
  #hud .row b { color:var(--accent); font-weight:600; }
  #hud .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  button { background:#2c3038; color:var(--fg); border:1px solid #444a55; border-radius:8px; padding:6px 10px;
           font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button[hidden] { display:none; }
  button.on { background:var(--accent); color:#1b1d22; border-color:var(--accent); }
  #hud { z-index:2; }
  #start { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
           background:radial-gradient(ellipse at center, rgba(10,11,14,.15), rgba(10,11,14,.6)); }
  #start[hidden] { display:none; }
  #startBtn { font-size:22px; font-weight:600; padding:18px 34px; border-radius:999px; background:var(--accent); color:#1b1d22;
              border:none; box-shadow:0 10px 40px rgba(217,165,33,.35), 0 4px 14px rgba(0,0,0,.4); cursor:pointer;
              animation:pulse 2.4s ease-in-out infinite; }
  #startBtn:hover { filter:brightness(1.08); }
  #start p { margin:0; font-size:13px; opacity:.7; }
  @keyframes pulse { 50% { transform:scale(1.04); box-shadow:0 14px 54px rgba(217,165,33,.5), 0 4px 14px rgba(0,0,0,.4); } }
  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); font-size:12px; opacity:.6; }
  #hud .head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #hud .head h1 { margin:0; }
  #hud .panel { margin-top:6px; }
  #hudToggle { display:none; padding:4px 9px; font-size:15px; line-height:1; }
  /* Kleine Bildschirme: Panel kompakter und ein-/ausklappbar, Hinweiszeile umbrechen */
  @media (max-width: 700px), (max-height: 500px) {
    #hud { top:8px; left:8px; right:8px; min-width:0; padding:10px 12px; }
    #hud h1 { font-size:16px; }
    #hud .btns { gap:5px; margin-top:8px; }
    button { padding:6px 8px; font-size:12px; }
    #hudToggle { display:block; }
    #hud.collapsed { right:auto; }
    #hud.collapsed .panel { display:none; }
    #hint { width:calc(100% - 32px); text-align:center; font-size:11px; bottom:8px; }
    body.hud-collapsed #hint { display:none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
    "./src/assembly.js": "./src/assembly.js?v=d804285b35",
    "./src/audio.js": "./src/audio.js?v=53c79f8f3d",
    "./src/ballcam.js": "./src/ballcam.js?v=bbd243222d",
    "./src/balls.js": "./src/balls.js?v=b10141e619",
    "./src/base.js": "./src/base.js?v=d1214cb585",
    "./src/bell.js": "./src/bell.js?v=a92a0838b9",
    "./src/chimes.js": "./src/chimes.js?v=f5d54e0cde",
    "./src/core.js": "./src/core.js?v=c4e37baf0a",
    "./src/geometry.js": "./src/geometry.js?v=607e803f77",
    "./src/interaction.js": "./src/interaction.js?v=5febefbb94",
    "./src/lift.js": "./src/lift.js?v=9702ad3dd0",
    "./src/lights.js": "./src/lights.js?v=f54c7913b6",
    "./src/main.js": "./src/main.js?v=9d66ec6f6a",
    "./src/materials.js": "./src/materials.js?v=ccc6ce5272",
    "./src/postfx.js": "./src/postfx.js?v=8149c8e3e4",
    "./src/track.js": "./src/track.js?v=abf54ea62e"
  }
}
</script>
</head>
<body>
<div id="hud">
  <div class="head">
    <h1>Kugelbahn</h1>
    <button id="hudToggle" aria-expanded="true" aria-controls="hudPanel" title="Bedienfeld ein-/ausblenden">✕</button>
  </div>
  <div class="panel" id="hudPanel">
  <div class="row">Kugeln: <b id="nBalls">0</b></div>
  <div class="row">Lift: <b id="phase">–</b></div>
  <div class="row">Runden: <b id="laps">0</b></div>
  <div class="btns">
    <button id="add">+ Kugel</button>
    <button id="pause">Pause</button>
    <button id="follow">Kamera folgen</button>
    <button id="ballcam">Kugelkamera</button>
    <button id="nextBall" hidden>Nächste Kugel</button>
    <button id="reset">Zurücksetzen</button>
    <button id="build">Neu aufbauen</button>
    <button id="sound" class="on">🔊 Ton</button>
    <button id="led">LED-Licht</button>
    <button id="rotate" class="on">Rotieren</button>
  </div>
  </div>
</div>
<div id="start"><button id="startBtn">▶ Kugelbahn aufbauen</button><p>mit Ton 🔊</p></div>
<div id="hint">Kugel antippen &amp; halten = anhalten · Kugel am Boden antippen = zurück nach oben · Ziehen = drehen · Rechtsklick = verschieben · Scrollen = zoomen</div>

<script>
  // Bedienfeld ein-/ausklappen (nur auf kleinen Bildschirmen sichtbar). Dort startet es eingeklappt.
  (() => {
    const hud = document.getElementById('hud'), btn = document.getElementById('hudToggle');
    const set = (collapsed) => {
      hud.classList.toggle('collapsed', collapsed);
      document.body.classList.toggle('hud-collapsed', collapsed);
      btn.textContent = collapsed ? '☰' : '✕';
      btn.setAttribute('aria-expanded', String(!collapsed));
    };
    btn.onclick = () => set(!hud.classList.contains('collapsed'));
    set(matchMedia('(max-width: 700px), (max-height: 500px)').matches);
  })();
  // iOS Safari ignoriert user-scalable=no: Seiten-Zoom per Pinch hier abfangen (Doppeltipp-Zoom
  // verhindert touch-action:manipulation). Pinch auf dem Canvas bleibt Kamera-Zoom (OrbitControls).
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('selectstart', (e) => e.preventDefault());
</script>
<!-- über die Import-Map, damit main.js die versionierte URL bekommt -->
<script type="module">import './src/main.js';</script>
</body>
</html>
